<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Lecture - AttendanceChimp</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 60px; }
    form p { margin: 12px 0; }
  </style>
</head>
<body>
  <h1>New Lecture</h1>
  <form method="post" action="/app/createLecture">
    <p>
      <label>Course:
        <select name="choice" required>
          {% for course in courses %}
            <option value="{{ course.name }}">{{ course.name }}</option>
          {% endfor %}
        </select>
      </label>
    </p>
    <p><button type="submit">Create Lecture</button></p>
  </form>
  <p><a href="/app/">Home</a></p>
</body>
</html>
