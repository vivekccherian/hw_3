<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign Up - AttendanceChimp</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 60px; }
    form p { margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Sign Up</h1>
  <form method="post" action="/app/createUser">
    <p><label>User name: <input type="text" name="user_name" required></label></p>
    <p><label>Email: <input type="email" name="email" required></label></p>
    <p><label>Password: <input type="password" name="password" required></label></p>
    <p>
      <label><input type="radio" name="is_student" value="1" checked> Student</label>
      <label><input type="radio" name="is_student" value="0"> Instructor</label>
    </p>
    <p><button type="submit">Sign Up</button></p>
  </form>
  <p><a href="/app/">Home</a></p>
</body>
</html>
